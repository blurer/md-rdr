[project]
name = "mdr"
version = "0.1.0"
description = "Lightweight markdown reader - renders markdown in the browser"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.5",
    "pygments>=2.17",
]

[project.scripts]
mdr = "mdr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdr"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
